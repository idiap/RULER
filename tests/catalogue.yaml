        sha256: sha256:78d57489d29644ea9f993f6b821d8ae895cd1ee91a30ad6ff897a057317443e2
        oracle_authorship: independent
    expected_assertions:
      - authenticate exact source bytes and source spans before accepting candidate semantics
      - exercise actor, modality, polarity, connective, exception, numbers_units_dates, temporal, coreference, precedence_references, and source-link mutations
