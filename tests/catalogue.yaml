cases:
  - case_id: TC-CATALOGUE-001
    title: Catalogue contracts and P0 semantic coverage
    owner: kb-quality
    controls: [TST-007]
    risk_class: critical
    lifecycle_stage: test-governance
    engine: deterministic
    oracle_type: exact
    fixtures: []
    expected_assertions:
      - reject duplicate IDs, unknown owners, dangling controls, and unhashed fixtures
      - cover negation and modality mutations
      - cover conditions and exceptions in both directions
      - preserve numbers_units_dates exactly
      - preserve territory_scope boundaries
      - preserve precedence_references and reject dangling edges
    output_schema: ruler.testing.catalogue.CatalogueIssue[]
    timeout_seconds: 10
    retries: 0
    budget: local-cpu-only
    cache_policy: exact-input-digest
    run_profiles: [local, pr, integration, release]
    retention_days: 365
    blocking_tier: pr
    coverage_modes: [positive, negative, boundary, stale_drift, recovery]
  - case_id: TC-HARNESS-001
    title: Isolated reproducible and resumable pipeline harness
    owner: ingestion-platform
    controls: [TST-008]
    risk_class: critical
    lifecycle_stage: all
    engine: deterministic
    oracle_type: invariant
    fixtures: []
    expected_assertions:
      - validators are read-only and worker scheduling preserves semantic bytes
    output_schema: pytest.assertion
    timeout_seconds: 30
    retries: 0
    budget: local-cpu-only
    cache_policy: disabled
    run_profiles: [local, pr, integration]
    retention_days: 365
    blocking_tier: pr
