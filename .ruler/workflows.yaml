- id: workflow-visualization
  visibility: public
  parent_workflow: workflow-graphs
- id: workflow-routing
  visibility: internal
  parent_workflow: workflow-router
- id: customer-demonstration
  visibility: public
  rationale: Shared lifecycle for configured domain workflows.
- id: reasoning-control
  visibility: public
  rationale: Shared lifecycle for configured domain workflows.
- id: translation-control
  visibility: public
  parent_workflow: translation-control
- id: claude-code
  visibility: public
  rationale: Client bridge validation lifecycle.
- id: opencode
  visibility: public
  rationale: Client bridge validation lifecycle.
- id: cross-platform
  visibility: public
  rationale: Runtime portability lifecycle.
- id: mcp-server
  visibility: public
  rationale: Read-only MCP runtime lifecycle.
- id: pre-commit
  visibility: lifecycle
  rationale: Local deterministic commit gate.
- id: pre-push
  visibility: lifecycle
