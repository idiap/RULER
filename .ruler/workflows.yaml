version: 1
defaults:
  lifecycle_status: active
  intended_caller: developer
  router_visibility: internal
  local_read: true
  local_write: true
  external_read: false
  external_write: false
  network: false
  deterministic: true
  expected_duration: medium
  cache_policy: content_hash
  confirmation_required: false
  resumable: false
  release_tier: integration
external_tools:
- id: codex
  executable: codex
  purpose: Read-only generative content and quality evaluator.
  version_spec: '>=0.1,<2'
  allowed_options:
  - exec
  - --ephemeral
  - --ignore-user-config
  - --strict-config
  - --sandbox
  - read-only
  - --cd
  - --skip-git-repo-check
  - --model
  - --output-schema
  - --json
  - --output-last-message
  - stdin
  forbidden_options:
  - --dangerously-bypass-approvals-and-sandbox
  - --full-auto
  effects:
    local_read: true
    local_write: false
    external_read: false
    external_write: false
    network: true
hook_policies:
- id: resource-portfolio
  visibility: public
  parent_workflow: resource-portfolio-plan
- id: source-ingestion
  visibility: public
  rationale: Shared lifecycle checks for registered domain workflows.
- id: formalization-wave
  visibility: lifecycle
  rationale: Shared lifecycle for configured domain workflows.
- id: clause-formalization
  visibility: internal
  parent_workflow: formalized-kb
- id: feature-grounding
  visibility: internal
  rationale: Shared lifecycle checks for registered domain workflows.
- id: solver-consistency
  visibility: public
