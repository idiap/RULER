  - data/domains/construction_fleet/tests/compile.yaml
  - data/domains/construction_fleet/tests/model.yaml
  - data/domains/construction_fleet/tests/schedule.yaml
  - data/domains/construction_fleet/tests/stress.yaml
  - data/domains/construction_fleet/tests/explanation.yaml
