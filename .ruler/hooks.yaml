    command: uv run ruler validate opencode
    required: true
  - name: skills
    command: uv run ruler validate skills
    required: true
  - name: hooks
    command: uv run ruler validate hooks
    required: true
- hook: cross-platform
  description: Validate macOS, Linux, and Windows setup paths, shell-independent hook
    execution, and portable artifact identifiers.
  commands:
  - name: cross-platform
    command: uv run ruler validate cross-platform
    required: true
  - name: skills
    command: uv run ruler validate skills
    required: true
  - name: hooks
    command: uv run ruler validate hooks
    required: true
- hook: mcp-server
  description: Validate the MCP server, allowlisted MCP tools/resources, and redacted
