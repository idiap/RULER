  commands:
  - name: api-config
    command: uv run ruler validate api-config
    required: true
  - name: mcp-server
    command: uv run ruler validate mcp-server
    required: true
  - name: skills
    command: uv run ruler validate skills
    required: true
  - name: hooks
    command: uv run ruler validate hooks
    required: true
